appId: com.notwallpaperengine.app
productName: NotWallpaperEngine
copyright: Copyright © 2024 NotWallpaperEngine Contributors

directories:
  output: build
  buildResources: assets

files:
  - main/**/*
  - renderer/**/*
  - assets/**/*
  - "!native/**/*"
  - "!build/**/*"

# macOS
mac:
  category: public.app-category.entertainment
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # All native binaries bundled as extra resources so main/ can find them at
  # process.resourcesPath at runtime.
  extraResources:
    - from: native/mac-helper/.build/release/mac-helper
      to: mac-helper
    - from: native/mac-saver/build/NotWPESaver.saver
      to: NotWPESaver.saver
      filter: ["**/*"]

dmg:
  title: NotWallpaperEngine ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: native/win-screensaver/release/NotWPE.scr
      to: NotWPE.scr

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: false
  createStartMenuShortcut: true

# Linux
linux:
  icon: assets/icon.png
  category: Utility
  target:
    - AppImage
    - deb

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
