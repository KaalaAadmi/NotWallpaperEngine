name: Build macOS

# Fires on version tags (e.g. v1.0.0) to produce a GitHub Release with DMG assets.
# Also fires on manual dispatch for a dry-run (publish: never, artifact upload only).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Swift mac-helper
        run: |
          swift build -c release
          BIN=$(swift build -c release --show-bin-path)/mac-helper
          cp "$BIN" Sources/mac-helper-bin
          echo "✅ mac-helper: $(ls -lh Sources/mac-helper-bin)"
        working-directory: native/mac-helper

      - name: Build NotWPESaver.saver
        run: bash native/mac-saver/build-saver.sh

      - name: Verify NotWPESaver.saver
        run: |
          SAVER=native/mac-saver/build/NotWPESaver.saver
          if [ ! -d "$SAVER" ]; then echo "❌ NotWPESaver.saver not found"; exit 1; fi
          echo "✅ NotWPESaver.saver found"

      - name: Package DMG and publish to GitHub Release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            npx electron-builder --mac dmg --x64 --arm64 --publish always
          else
            npx electron-builder --mac dmg --x64 --arm64 --publish never
          fi

      - name: Upload DMG as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NotWallpaperEngine-dmg-${{ github.sha }}
          path: build/*.dmg
