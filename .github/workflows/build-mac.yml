name: Build macOS

# Fires on every push to master and on manual dispatch.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # cache: npm
          # cache-dependency-path: NotWallpaperEngine/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: NotWallpaperEngine

      - name: Build Swift mac-helper
        run: swift build -c release
        working-directory: NotWallpaperEngine/native/mac-helper

      - name: Verify mac-helper binary
        run: |
          BIN=NotWallpaperEngine/native/mac-helper/.build/release/mac-helper
          if [ ! -f "$BIN" ]; then
            echo "❌ mac-helper not found"
            exit 1
          fi
          echo "✅ mac-helper: $(ls -lh $BIN)"

      - name: Build NotWPESaver.saver
        run: bash native/mac-saver/build-saver.sh
        working-directory: NotWallpaperEngine

      - name: Verify NotWPESaver.saver
        run: |
          SAVER=NotWallpaperEngine/native/mac-saver/build/NotWPESaver.saver
          if [ ! -d "$SAVER" ]; then
            echo "❌ NotWPESaver.saver not found"
            exit 1
          fi
          echo "✅ NotWPESaver.saver found"

      - name: Package DMG (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        working-directory: NotWallpaperEngine

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NotWallpaperEngine-dmg-${{ github.sha }}
          path: NotWallpaperEngine/build/*.dmg
          # retention-days: 30
