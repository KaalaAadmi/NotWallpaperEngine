<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #wallpaper-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* default; overridden by JS */
    }
  </style>
</head>
<body>
  <!-- Starts muted; hotkey can unmute via set-mute IPC command -->
  <video
    id="wallpaper-video"
    autoplay
    loop
    playsinline
    disablepictureinpicture
  ></video>
  <script src="wallpaper.js"></script>
</body>
</html>
